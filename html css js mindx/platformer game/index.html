<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platformer Game</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div class="start-screen">
        <h1 class="main-title">Platform Adventure</h1>
        <p class="instructions">
            Guide your character through the level and reach every glowing checkpoint.
        </p>
        <p class="instructions">
            Use the arrow keys to move around the world.
        </p>
        <p class="instructions">Press the spacebar to jump.</p>

        <div class="btn-container">
            <button class="btn" id="start-btn">Start Game</button>
        </div>
    </div>

    <div class="checkpoint-screen">
        <h2>Great Job!</h2>
        <p>You reached the final checkpoint.</p>
    </div>

    <canvas id="canvas"></canvas>

    <script src="./script.js"></script>
</body>

</html>
