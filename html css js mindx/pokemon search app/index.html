<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Finder</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="app">
        <h1 class="title">Pokémon Finder</h1>

        <section class="search-section">
            <form id="pokemon-search">
                <label for="search-input">Enter a Pokémon name or ID:</label>
                <div class="input-row">
                    <input id="search-input" type="text" required />
                    <button id="search-btn" type="submit">Search</button>
                </div>
            </form>
        </section>

        <section class="pokemon-card">
            <div class="details-top">
                <div class="name-id">
                    <h2 id="pokemon-name"></h2>
                    <span id="pokemon-id"></span>
                </div>

                <div class="pokemon-size">
                    <span id="weight"></span>
                    <span id="height"></span>
                </div>

                <div id="sprite-container" class="sprite-box"></div>
                <div id="types" class="type-tags"></div>
            </div>

            <div class="details-bottom">
                <table>
                    <thead>
                        <tr>
                            <th>Stat</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>HP</td>
                            <td id="hp"></td>
                        </tr>
                        <tr>
                            <td>Attack</td>
                            <td id="attack"></td>
                        </tr>
                        <tr>
                            <td>Defense</td>
                            <td id="defense"></td>
                        </tr>
                        <tr>
                            <td>Sp. Atk</td>
                            <td id="special-attack"></td>
                        </tr>
                        <tr>
                            <td>Sp. Def</td>
                            <td id="special-defense"></td>
                        </tr>
                        <tr>
                            <td>Speed</td>
                            <td id="speed"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <script src="script.js"></script>
    </main>
</body>

</html>
