<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>City Skyline</title>
    <link href="styles.css" rel="stylesheet" />
</head>

<body>
    <div class="background-layer sky">
        <div></div>
        <div></div>

        <div class="bg-1 stack">
            <div class="bg-1a bg-window"></div>
            <div class="bg-1b bg-window"></div>
            <div class="bg-1c bg-window"></div>
            <div class="bg-1d"></div>
        </div>

        <div class="bg-2">
            <div class="bg-2a"></div>
            <div class="bg-2b"></div>
        </div>

        <div class="bg-3"></div>
        <div></div>

        <div class="bg-4 stack">
            <div class="bg-4a"></div>
            <div class="bg-4b"></div>

            <div class="bg-4c row">
                <div class="bg-4-window"></div>
                <div class="bg-4-window"></div>
                <div class="bg-4-window"></div>
                <div class="bg-4-window"></div>
            </div>
        </div>

        <div></div>
        <div></div>
    </div>

    <div class="foreground-layer">
        <div></div>
        <div></div>

        <div class="fg-1 stack">
            <div class="fg-1a"></div>
            <div class="fg-1b"></div>
            <div class="fg-1c"></div>
        </div>

        <div class="fg-2">
            <div class="fg-2a"></div>

            <div class="fg-2b row">
                <div class="fg-2-window"></div>
                <div class="fg-2-window"></div>
                <div class="fg-2-window"></div>
            </div>
        </div>

        <div></div>

        <div class="fg-3 stack">
            <div class="fg-3a row">
                <div class="fg-3-window"></div>
                <div class="fg-3-window"></div>
                <div class="fg-3-window"></div>
            </div>
            <div class="fg-3b"></div>
            <div class="fg-3a"></div>
            <div class="fg-3b"></div>
        </div>

        <div class="fg-4">
            <div class="fg-4a"></div>
            <div class="fg-4b">
                <div class="fg-4-window"></div>
                <div class="fg-4-window"></div>
                <div class="fg-4-window"></div>
                <div class="fg-4-window"></div>
                <div class="fg-4-window"></div>
                <div class="fg-4-window"></div>
            </div>
        </div>

        <div class="fg-5"></div>
        <div class="fg-6"></div>

        <div></div>
        <div></div>
    </div>
</body>

</html>
