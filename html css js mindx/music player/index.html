<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lato&family=Roboto+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://kit.fontawesome.com/5abffc5209.js" crossorigin="anonymous"></script>
    <title>Music Player App</title>
</head>

<body>
    <div class="container">
        <div class="player">
            <div class="player-bar">
                <div class="parallel-lines">
                    <div></div>
                    <div></div>
                </div>
                <h1 class="title">Playing</h1>
                <div class="parallel-lines">
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div class="player-content">
                <div id="player-album-art">
                    <img src="./media/quincy-larson-album-art.jpg" alt="song cover art" />
                </div>
                <div class="player-display">
                    <div class="player-display-song-artist">
                        <p id="player-song-title"></p>
                        <p id="player-song-artist"></p>
                    </div>
                    <div class="player-buttons">
                        <button id="previous" class="previous" aria-label="Previous">
                            <i class="fa-solid fa-backward-step fa-xl"></i>
                        </button>
                        <button id="play" class="play" aria-label="Play">
                            <i class="fa-solid fa-play fa-xl"></i>
                        </button>
                        <button id="pause" class="pause" aria-label="Pause">
                            <i class="fa-solid fa-pause fa-xl"></i>
                        </button>
                        <button id="next" class="next" aria-label="Next">
                            <i class="fa-solid fa-forward-step fa-xl"></i>
                        </button>
                        <button id="shuffle" class="shuffle" aria-label="Shuffle">
                            <i class="fa-solid fa-shuffle fa-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="playlist">
            <div class="playlist-bar">
                <div class="parallel-lines">
                    <div></div>
                    <div></div>
                </div>
                <h2 class="playlist-title" id="playlist">Playlist</h2>
                <div class="parallel-lines">
                    <div></div>
                    <div></div>
                </div>
            </div>
            <ul id="playlist-songs"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
