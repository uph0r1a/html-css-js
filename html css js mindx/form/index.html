<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Registration Form</h1>
    <p>Please fill out this form with the required information</p>

    <form method="post" action="/register">
        <fieldset>
            <label for="first-name">
                First Name:
                <input id="first-name" name="first-name" type="text" required>
            </label>

            <label for="last-name">
                Last Name:
                <input id="last-name" name="last-name" type="text" required>
            </label>

            <label for="email">
                Email:
                <input id="email" name="email" type="email" required>
            </label>

            <label for="new-password">
                Create a Password:
                <input id="new-password" name="new-password" type="password" pattern="[a-zA-Z0-9!@#$%^&*]{8,}" required>
            </label>
        </fieldset>

        <fieldset>
            <legend>Account Type <span aria-hidden="true">*</span></legend>

            <label for="personal-account">
                <input id="personal-account" type="radio" name="account-type" value="personal" class="inline" checked>
                Personal
            </label>

            <label for="business-account">
                <input id="business-account" type="radio" name="account-type" value="business" class="inline">
                Business
            </label>
        </fieldset>

        <fieldset>
            <label for="profile-picture">
                Upload Profile Picture:
                <input id="profile-picture" type="file" name="profile-picture">
            </label>

            <label for="age">
                Age:
                <input id="age" type="number" name="age" min="13" max="120">
            </label>

            <label for="referrer">
                How did you hear about us?
                <select id="referrer" name="referrer">
                    <option value="">(Select One)</option>
                    <option value="news">News Website</option>
                    <option value="youtube">YouTube</option>
                    <option value="friend">Friend</option>
                    <option value="other">Other</option>
                </select>
            </label>

            <label for="bio">
                Short Bio:
                <textarea id="bio" name="bio" rows="3" placeholder="Tell us a little about yourself..."></textarea>
            </label>
        </fieldset>

        <label for="terms-and-conditions" class="terms-label">
            <input id="terms-and-conditions" type="checkbox" required name="terms" class="inline">
            I agree to the <a href="#">Terms & Conditions</a>
        </label>

        <input type="submit" value="Register">
    </form>
</body>

</html>
